# Локальная разработка meta-bot-core: API + PostgreSQL 16 + Redis 7.
# Паттерн — как в sro-agent-core: uv run uvicorn --reload, код примонтирован,
# .venv контейнера защищён анонимным volume. Секреты — в .env (см. .env.example).

name: meta-bot-core

networks:
  dev:

volumes:
  pgdata:

services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    restart: on-failure
    container_name: meta-bot-core-api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthchecks/').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # env_file намеренно не используется: локальный Docker Compose старых версий
    # не умеет optional-синтаксис, а обязательный .env ломает свежий клон.
    # Переменные приходят из environment (дефолты) и хостового окружения/.env
    # через интерполяцию ${...}.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metabot}:${POSTGRES_PASSWORD:-metabot}@postgres:5432/${POSTGRES_DB:-metabot}
      REDIS_URL: redis://redis:6379/0
      # ADR-0013: локально пишем и файлы логов (смонтированы на хост ./logs —
      # errors.log содержит только ERROR со стеками). В проде LOG_DIR не задаётся.
      LOG_DIR: ${LOG_DIR:-logs}
    # Миграции применяются на старте: контур запуска всегда даёт актуальную схему.
    command: sh -c "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev
    volumes:
      - ./src:/app/src  # live-reload; .venv образа bind'ом не перекрывается
      - ./logs:/app/logs  # файлы логов видны на хосте (ADR-0013)
      - ./.secrets:/app/.secrets  # dev-vault на хосте: переживает пересоздание контейнера

  postgres:
    image: postgres:16-alpine
    container_name: meta-bot-core-postgres
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metabot}
      POSTGRES_DB: ${POSTGRES_DB:-metabot}
    ports:
      - "127.0.0.1:5433:5432"  # только loopback; 5432 хоста занят соседним проектом
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metabot} -d ${POSTGRES_DB:-metabot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev

  redis:
    image: redis:7-alpine
    container_name: meta-bot-core-redis
    restart: on-failure
    ports:
      - "127.0.0.1:6379:6379"  # только loopback: в Redis живёт FSM с ПДн (ADR-0008)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev

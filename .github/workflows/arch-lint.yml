name: Arch lint (Clean Architecture boundaries)

# Строгий режим CA: границы слоёв проверяются import-linter'ом.
# Контракт — .importlinter; смысл — memory-bank/architecture/overview.md.

on:
  pull_request:
    paths:
      - "src/**"
      - ".importlinter"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/arch-lint.yml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - ".importlinter"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs: версия из истории git

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установка окружения (uv.lock)
        run: uv sync --frozen

      - name: lint-imports (границы слоёв)
        env:
          PYTHONPATH: src
        run: uv run lint-imports

name: Arch lint (Clean Architecture boundaries)

# Строгий режим CA: границы слоёв проверяются import-linter'ом.
# Контракт — .importlinter; смысл — memory-bank/architecture/overview.md.
# Пока пакета src/ нет (только каркас), джоба помечает себя пройденной и
# ничего не проверяет — активируется автоматически с появлением кода.

on:
  pull_request:
    paths:
      - "src/**"
      - ".importlinter"
      - "pyproject.toml"
      - ".github/workflows/arch-lint.yml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - ".importlinter"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Guard — код ещё не заведён
        id: guard
        run: |
          if [ -d src ]; then
            echo "has_src=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_src=false" >> "$GITHUB_OUTPUT"
            echo "Пакет src/ отсутствует — arch-lint пропущен (каркас проекта)."
          fi

      - name: Install project + import-linter
        if: steps.guard.outputs.has_src == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install import-linter

      - name: lint-imports (границы слоёв)
        if: steps.guard.outputs.has_src == 'true'
        env:
          PYTHONPATH: src
        run: lint-imports
